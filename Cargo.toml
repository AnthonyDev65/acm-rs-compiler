[package]
name = "acm"
version = "0.1.0"
edition = "2024"
description = "acm: lenguaje de automatización de escritorio y web (ratón, teclado, ventanas, Chrome/Edge)"
authors = ["AnthonyDev65"]

[[bin]]
name = "acm"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
enigo = "0.6.1"
headless_chrome = { version = "1.0.22", default-features = false }
# Solo para habilitar el guardado PNG de las capturas de xcap.
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify-rust = "4.18.2"
rustyline = "19.0.0"
serde_json = "1.0.154"
xcap = "0.9.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_Globalization", "Win32_System_Environment"] }

[profile.dev]
# Sin información de depuración: la caché de target/debug ocupa mucho menos.
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
# Copia de headless_chrome 1.0.22 con READ_TIMEOUT de 2 ms (ver vendor/headless_chrome/ACM_PATCH.md)
headless_chrome = { path = "vendor/headless_chrome" }
