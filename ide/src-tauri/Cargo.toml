[package]
name = "acm-ide"
version = "0.1.0"
description = "IDE para el lenguaje acm"
authors = ["AnthonyDev65"]
edition = "2021"

# Proyecto independiente: no forma parte del paquete acm de la raíz.
[workspace]

[lib]
name = "acm_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = false
