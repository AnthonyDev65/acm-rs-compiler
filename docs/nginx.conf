server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # /docs y /docs/ sirven docs/index.html; /pagina sirve pagina.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Los recursos de Astro llevan hash en el nombre: se pueden cachear para siempre.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
